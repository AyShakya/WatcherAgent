<!DOCTYPE html>

                        "tertiary-fixed-dim": "#ccc98e",

                        "surface-container-low": "#f9f2ed",
                        "primary-fixed": "#eedbff",

                        "surface-bright": "#fff8f3",
                        "secondary": "#934930",

                        "on-primary-fixed": "#231435",
                        "on-error": "#ffffff",

                },

        }

<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden">
<!-- Blurred Dashboard Background -->
<main class="fixed inset-0 z-0 flex blur-md scale-105 pointer-events-none opacity-50">
<!-- Mock SideNav (Background) -->
<aside class="w-64 bg-surface-container border-r border-warm-gray/20 flex flex-col p-unit">
<div class="font-display text-headline-sm font-bold text-primary mb-8 px-4">Watcher Console</div>
<div class="space-y-2 px-2">
<div class="h-10 bg-paper-surface rounded-lg"></div>
<div class="h-10 w-full"></div>
<div class="h-10 w-full"></div>
</div>
</aside>
<!-- Mock Content (Background) -->
<div class="flex-1 flex flex-col">
<header class="h-16 border-b border-warm-gray/20 px-margin-desktop flex items-center justify-between">
<div class="h-6 w-48 bg-warm-gray/10 rounded"></div>
<div class="flex gap-4">
<div class="h-8 w-8 bg-warm-gray/10 rounded-full"></div>
<div class="h-8 w-8 bg-warm-gray/10 rounded-full"></div>
</div>
</header>
<section class="p-margin-desktop grid grid-cols-12 gap-gutter">
<div class="col-span-8 space-y-gutter">
<div class="h-64 bg-surface-container-low border border-warm-gray/20 rounded-xl"></div>
<div class="grid grid-cols-2 gap-gutter">
<div class="h-48 bg-surface-container-low border border-warm-gray/20 rounded-xl"></div>
<div class="h-48 bg-surface-container-low border border-warm-gray/20 rounded-xl"></div>
</div>
</div>
<div class="col-span-4 h-[600px] bg-surface-container-low border border-warm-gray/20 rounded-xl"></div>
</section>
</div>
</main>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink-black/20 backdrop-blur-[2px]">
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-[0_20px_40px_rgba(36,34,32,0.08)] border border-warm-gray/20 flex flex-col max-h-[921px] overflow-hidden">
<!-- Modal Header -->
<header class="px-8 py-6 border-b border-warm-gray/10 flex items-center justify-between">
<div>
<h1 class="font-headline-md text-headline-md text-ink-black">Onboard New Project</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Configure your repository and alert endpoints to start monitoring.</p>
</div>
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Modal Content (Scrollable) -->
<form class="flex-1 overflow-y-auto p-8 space-y-8 no-scrollbar">
<!-- Section: Identity -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">PROJECT/SERVICE NAME</label>
<input class="w-full bg-paper-surface border border-warm-gray/20 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="e.g. Production Analytics API" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">DESCRIPTION (OPTIONAL)</label>
<input class="w-full bg-paper-surface border border-warm-gray/20 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="Brief system overview" type="text"/>
</div>
</div>
<!-- Section: GitHub Connection -->
<div class="space-y-6">
<div class="flex items-center gap-2 pb-2 border-b border-warm-gray/10">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">code</span>
<h2 class="font-label-md text-label-md text-ink-black tracking-widest uppercase">GitHub Configuration</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">GITHUB REPOSITORY OWNER</label>
<input class="w-full bg-paper-surface border border-warm-gray/20 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="org-or-username" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">GITHUB REPOSITORY NAME</label>
<input class="w-full bg-paper-surface border border-warm-gray/20 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="repo-slug" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">GITHUB PAT TOKEN</label>
<div class="relative">
<input class="w-full bg-paper-surface border border-warm-gray/20 rounded-lg px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="ghp_xxxxxxxxxxxx" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-warm-gray hover:text-primary" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<p class="font-body-sm text-[11px] text-on-surface-variant italic">Required scopes: repo, read:org</p>
</div>
</div>
<!-- Section: Alerts & Vector Store -->
<div class="space-y-6">
<div class="flex items-center gap-2 pb-2 border-b border-warm-gray/10">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">hub</span>
<h2 class="font-label-md text-label-md text-ink-black tracking-widest uppercase">Integrations &amp; Intelligence</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">DISCORD ALERT CHANNEL ID</label>
<input class="w-full bg-paper-surface border border-warm-gray/20 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="112233445566778899" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">PINECONE NAMESPACE SEGMENT</label>
<input class="w-full bg-paper-surface border border-warm-gray/20 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="prod-cluster-v1" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">OPENROUTER LLM KEY</label>
<div class="relative">
<input class="w-full bg-paper-surface border border-warm-gray/20 rounded-lg px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="sk-or-v1-..." type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-warm-gray hover:text-primary" type="button">
<span class="material-symbols-outlined">key</span>
</button>
</div>
</div>
</div>
</form>
<!-- Modal Footer -->
<footer class="px-8 py-6 border-t border-warm-gray/10 bg-surface-container-low flex flex-col md:flex-row justify-end items-center gap-4">
<button class="w-full md:w-auto px-8 py-3 text-on-surface-variant font-label-md text-label-md hover:text-ink-black transition-colors" type="button">
                    Cancel
                </button>
<button class="w-full md:w-auto px-8 py-3 bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Activate Project Webhook
                    <span class="material-symbols-outlined" style="font-size: 18px;">bolt</span>
</button>
</footer>
</div>
</div>
<script>
        // Micro-interaction for input focus effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });

        // Simple visibility toggle for PAT and Key fields
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                const icon = this.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.innerText = 'visibility_off';
                } else if (input.type === 'text') {
                    input.type = 'password';
                    icon.innerText = 'visibility';
                }
            });
        });
    </script>
</body></html>
