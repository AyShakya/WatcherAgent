services:
  postgres:
    image: postgres:15-alpine
    container_name: watcher-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: watcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d watcher"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: watcher-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: watcher-api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/watcher
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
      INTERNAL_CALLBACK_SECRET: ${INTERNAL_CALLBACK_SECRET:-orchestration-callback-key-9999}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: server/worker/Dockerfile
    container_name: watcher-worker
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/watcher
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      INTERNAL_CALLBACK_SECRET: ${INTERNAL_CALLBACK_SECRET:-orchestration-callback-key-9999}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
