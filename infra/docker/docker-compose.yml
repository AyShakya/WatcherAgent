version: "3.8"

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - watcher

  watcher:
    build:
      context: ../../
      dockerfile: infra/docker/watcher.Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:Z
    env_file:
      - ../env/watcher.env
      - ../env/watcherai.env
    environment:
      - NODE_ENV=production
    user: root
    group_add:
      - "971"